name: PHP CodeSniffer

on:
  push:
    branches:
    - main
    paths:
    - '**.php'
    - '.phpcs.xml*'
    - 'phpcs.xml*'
    - composer.json
    - composer.lock
    - .github/workflows/phpcs.yml
  pull_request:
    branches:
    - main
    paths:
    - '**.php'
    - '.phpcs.xml*'
    - 'phpcs.xml*'
    - composer.json
    - composer.lock
    - .github/workflows/phpcs.yml

jobs:
  phpcs:
    uses: openCoreEMR/github-workflows-public/.github/workflows/php-composer-script.yml@0.0.4
    with:
      name: Run PHP CodeSniffer
      run: composer phpcs
      php-version: '8.2'
