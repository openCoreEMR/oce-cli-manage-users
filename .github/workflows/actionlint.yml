name: actionlint

on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/**
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/**

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Run actionlint
      uses: rhysd/actionlint@v1.7.12
