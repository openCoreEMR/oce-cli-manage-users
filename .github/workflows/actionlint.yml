name: actionlint

on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/**
    - .github/actions/**
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/**
    - .github/actions/**

jobs:
  actionlint:
    uses: openCoreEMR/github-workflows-public/.github/workflows/actionlint.yml@0.0.5
