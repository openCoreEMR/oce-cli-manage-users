name: PHP Syntax Check

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  syntax:
    name: Check PHP Syntax
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none

    - name: Check PHP syntax
      run: find src bin -name "*.php" -exec php -l {} \;
