name: Composer Validate

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
        tools: composer:v2

    - name: Validate composer.json
      run: composer validate --strict
